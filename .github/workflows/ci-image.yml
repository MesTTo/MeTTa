# Purpose: publish the container image every other workflow runs inside.
#
# checks.yml runs its gate, report, wheel and packaging jobs in
# ghcr.io/mestto/metta-kernel-ci:latest, and nothing published it. ci.yml
# builds the image only on a PULL REQUEST that touches the Dockerfile, and
# this repository's history was pushed straight to main, so `:latest` never
# existed and every job died at "manifest unknown" before running a line of
# the suite. Its own header says it publishes `:latest` on a push to main;
# the condition below is that sentence, made true.
#
# Manual dispatch is here because the image has to be publishable ONCE
# without a Dockerfile change: the first publication is the case the
# change-driven trigger cannot reach.
name: ci-image

on:
  push:
    branches:
      - main
    # The image's inputs: the Dockerfile and the two directories it copies.
    paths:
      - ".github/ci/Dockerfile"
      - ".github/ci/Dockerfile.dockerignore"
      - "tools/pymetta-host/**"
      - "tests/checks/host_workarounds/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The root, because the image copies the host build tooling and the
          # patches; .github/ci/Dockerfile.dockerignore sends only those.
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ghcr.io/mestto/metta-kernel-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
