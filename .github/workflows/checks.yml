# Purpose: verify the engine, language surfaces and package artifacts in CI.
# Guarantees: the browser bundle executes in Chromium, not only in Node.
#   [tested: npm run test:browser; commit=04fde431963bd063ef4ab5dc9b579ff2faba9fe8]
name: Checks

# The existing ci.yml gates pull requests into main only, so work on any
# other branch never met a gate. This runs on every push and every pull
# request, against the same container ci.yml resolves, so the engine and
# SWI-Prolog are already present.
on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Correctness. A failure here blocks.
  gate:
    # 18 and 19 minutes over the two runs before 2026-09-05, so this is
    # two and a half times the observed cost and eight times better than
    # GitHub's 360-minute default, which was the only bound a hung swipl
    # here had.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mestto/metta-kernel-ci:latest
      # The parity lane counts retired instructions with perf, and Docker's
      # default seccomp profile denies perf_event_open outright, so inside a
      # container `perf stat -e instructions:u` answers `No permission to
      # enable instructions:u event` even as root. Measured on this image's
      # own base: swipl:latest plus linux-perf counts nothing under the
      # default profile and answers `130379,,instructions:u,249770,100.00,,`
      # with the profile off. This is the narrowest option that lets the
      # syscall through; it does not grant privileges.
      options: --security-opt seccomp=unconfined
    steps:
      # Every component of this repository is a submodule since the many-repo
      # split, and `actions/checkout` does not populate one unless asked. Without
      # this the runner gets eight empty directories: the root `pyproject.toml` is
      # a symlink into `extensions/python/`, so it dangles and `setup-python`
      # fails with "The specified python version file at: pyproject.toml doesn't
      # exist" before any check runs, which is why every job of run 35521501467
      # failed including `report`, whose own step cannot fail.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The parity lane compares this engine against numbers measured from
      # upstream PeTTa at this commit, and it REFUSES rather than skipping
      # when the checkout is absent and CI is set, so this step is what lets
      # that lane fail here instead of printing a skip on every push. Shallow
      # and BY COMMIT: the harness reads the checkout's HEAD and a rebaseline
      # against any other commit is refused, because the recorded upstream
      # numbers came from this one. github.com serves an arbitrary object ID
      # to `fetch --depth 1`, which is what makes the pin fetchable without
      # the history [measured 2026-09-06: the four commands below against
      # github.com answer ae66fa8e41dcd5539d614706bd4e5cfb34f9608d].
      - name: Check out the pinned upstream PeTTa beside the repository
        run: |
          set -eu
          upstream="$(dirname "$GITHUB_WORKSPACE")/PeTTa-upstream"
          pin=ae66fa8e41dcd5539d614706bd4e5cfb34f9608d
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/trueagi-io/PeTTa
          git -C "$upstream" fetch -q --depth 1 origin "$pin"
          git -C "$upstream" checkout -q FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$pin"

      # Before the gate rather than 13 minutes into it. Without a readable
      # counter the parity lane cannot measure anything, and the two things
      # that decide it are the container's seccomp profile, set above, and the
      # host's perf_event_paranoid, which a container job cannot change.
      #
      # The test is a COUNT, not the event name. `grep -q instructions:u`
      # passes on the refusal, which says `No permission to enable
      # instructions:u event`, so the first shape of this step reported a
      # readable counter inside a container that could not count at all. It
      # now asks what check_upstream_parity._perf asks: a `-x ,` row whose
      # third field is the event and whose first is a number.
      - name: Verify the instruction counter is readable
        run: |
          set -eu
          if ! perf stat -e instructions:u -x , true 2>&1 |
               awk -F, '$3 == "instructions:u" && $1 ~ /^[0-9]+$/ { found = 1 }
                        END { exit !found }'
          then
            echo "error: perf cannot count instructions:u in this container." >&2
            echo "perf_event_paranoid reads $(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unreadable); 2 or less is needed." >&2
            echo "Two things decide this: the container's seccomp profile," >&2
            echo "which this job sets to unconfined because Docker's default" >&2
            echo "denies perf_event_open, and the host's perf_event_paranoid," >&2
            echo "which a container job cannot change." >&2
            perf stat -e instructions:u -x , true || true
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package and the check tools
        # --all-packages, because this repository is a uv WORKSPACE: the core
        # and one distribution per extension package. Without it uv installs
        # the root project alone and every member's own suite fails to import
        # the module it tests.
        run: uv sync --locked --all-packages --extra checks

      - name: Install the reviewed Ciao-grade packs
        run: |
          swipl -q -g "
            use_module(library(prolog_pack)),
            pack_install(lambda,
                         [interactive(false), test(false), register(false)]),
            pack_install('https://github.com/edisonm/xlibrary.git',
                         [commit('HEAD'), branch(master), interactive(false),
                          test(false), register(false)]),
            pack_install('https://github.com/edisonm/assertions.git',
                         [commit('HEAD'), branch(master), interactive(false),
                          test(false), register(false)]),
            pack_install('https://github.com/edisonm/rtchecks.git',
                         [commit('HEAD'), branch(master), interactive(false),
                          test(false), register(false)]),
            halt" -t 'halt(1)'
          for ciao_spec in \
              assertions:4e4244c77a92bb84d1f75fd636b95625d04923bf \
              rtchecks:be9f11ce1c3d85fae6dbb3653ccfeb2b37b27f6d \
              xlibrary:ce589b56dbfa9f7aa39384156d441962b8bb3910
          do
            ciao_pack=${ciao_spec%%:*}
            ciao_want=${ciao_spec#*:}
            ciao_dir=$(swipl -q -g \
              "use_module(library(prolog_pack)),pack_property($ciao_pack,directory(D)),write(D),halt" \
              -t 'halt(1)')
            ciao_got=$(git -C "$ciao_dir" rev-parse HEAD)
            if [ "$ciao_got" != "$ciao_want" ]; then
              printf '%s: expected %s, got %s\n' \
                "$ciao_pack" "$ciao_want" "$ciao_got" >&2
              exit 1
            fi
          done

      # The Node binding runs the engine in a WebAssembly SWI, so it needs node
      # and swipl-wasm and nothing else. Without this step check.sh's
      # node-binding lane says it cannot run and the conformance kit in
      # extensions/python/tests/ch21_another_language_at_the_seam/test_node_binding.py
      # skips, which is a green run that tested the seam's second consumer not
      # at all. The docs lane has the same provisioning boundary: it needs
      # VitePress before its blocking build can render the site and check dead
      # links.
      # One cache entry is enough because setup-node caches npm's shared download
      # cache, not node_modules; key it with both lockfiles, then install both.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            extensions/node/package-lock.json
            website/package-lock.json

      - name: Install the Node binding's dependencies
        run: npm ci --prefix extensions/node

      - name: Install Chromium for the browser binding
        working-directory: extensions/node
        run: npx playwright install --with-deps chromium

      # BEFORE the browser suite, not after it. That suite drives the
      # documentation site's `MettaRun` component, and it is the site's own
      # vite, @vitejs/plugin-vue and vue that compile a `.vue` here; without
      # them the two component cases skip by name, which is a green run that
      # checked the site's fences not at all.
      - name: Install the documentation site's dependencies
        run: npm ci --prefix website

      - name: Verify the browser binding
        run: npm run test:browser --prefix extensions/node

      - name: Gate
        env:
          # Hypothesis derandomizes in CI so a red example is reproducible.
          HYPOTHESIS_PROFILE: ci
          # The interpreter `uv sync` installed INTO, not the bare one on
          # PATH. uv writes .venv and does not activate it, so `python` here
          # was an interpreter with none of the dependencies the step above
          # resolved: the numpy example failed on `py-atom numpy.absolute`
          # because the engine's own janus was reading that interpreter.
          CHECK_PY: ${{ github.workspace }}/.venv/bin/python
        run: |
          # CHECK_PY is the interpreter the lanes RUN; it is not the one the
          # ENGINE embeds. The shell suite invokes swipl directly, and swipl's
          # own janus initialises whatever interpreter it finds, so an example
          # reaching `py-atom numpy.absolute` looked in a Python that had
          # never seen numpy. PYTHONPATH is what that embedded interpreter
          # reads, so the packages uv resolved become importable from inside
          # the engine as well as beside it.
          export PYTHONPATH="$("$CHECK_PY" -c 'import site; print(site.getsitepackages()[0])')"
          GATE_ONLY=1 sh tools/check.sh

  # The burn-down surface. Always runs, never blocks, and the log is the
  # record of what section of ai-code-organisation-and-fixes.md is left.
  report:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mestto/metta-kernel-ci:latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package and the check tools
        # --all-packages, because this repository is a uv WORKSPACE: the core
        # and one distribution per extension package. Without it uv installs
        # the root project alone and every member's own suite fails to import
        # the module it tests.
        run: uv sync --locked --all-packages --extra checks

      - name: Report
        env:
          CHECK_PY: ${{ github.workspace }}/.venv/bin/python
        run: |
          sh tools/check.sh ruff mypy ty pylint perflint xenon refurb bandit \
                      deptry interrogate codespell imports || true

  # The declared Python floor, tested rather than asserted.
  # Minimal environments on purpose: no optional integration package is
  # installed, because the suite must skip those cleanly rather than need
  # them. That includes the two gallery programs whose subject is an
  # ecosystem package; the gate job installs the checks extra and runs all
  # six. Add a version here and it is covered from then on.
  versions:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mestto/metta-kernel-ci:latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The PyPI janus_swi wheel links libswipl.so.9; building from source
      # links whatever SWI the image actually has.
      #
      # This list is the project's own required dependencies plus the test
      # runner, and nothing else. It is checked against pyproject.toml by
      # test_the_minimal_version_matrix_installs_every_required_dependency,
      # because it went stale exactly once already: docstring-parser became
      # required on 2026-08-23 and was not added here, so `import metta`
      # raised ModuleNotFoundError in every matrix job from that day.
      - name: Environment for ${{ matrix.python }}
        run: |
          uv venv --python ${{ matrix.python }} /tmp/v
          # pytest-randomly and pytest-timeout are here because the SHIPPED
          # pytest configuration names their options, and pytest raises
          # `PytestConfigWarning: Unknown config option: timeout` for an option
          # no loaded plugin registered -- which `filterwarnings = error` turns
          # into an INTERNALERROR before a single test runs [measured
          # 2026-09-07]. A bare floor is still the subject of this job; these
          # two are part of running the suite at all, like pytest itself.
          uv pip install --python /tmp/v/bin/python --no-binary janus_swi \
                         janus_swi docstring-parser annotated-types pytest hypothesis \
                         pytest-randomly pytest-timeout
          # The package itself, WITHOUT its dependencies: this job's subject is
          # the library on a bare floor, and pulling an extra in would make the
          # skip-clean property it exists to prove untestable. Installing
          # rather than path-adding is still required, because metta ships its
          # pytest fixtures through the pytest11 ENTRY POINT and an entry point
          # exists only for an installed distribution.
          uv pip install --python /tmp/v/bin/python --no-deps -e .

      - name: Suite on ${{ matrix.python }}
        env:
          HYPOTHESIS_PROFILE: ci
        run: /tmp/v/bin/python -m pytest extensions/python/tests/ --rootdir=extensions/python -c extensions/python/pyproject.toml -q

  # macOS and Windows, which the container jobs above cannot reach: they run
  # inside a Linux image that already has SWI-Prolog, so nothing there has ever
  # exercised the two platforms a reader is most likely to be on. Verified by
  # hand on 2026-08-29 against a Mac mini (macOS 26.4.1, arm64) and a Windows
  # laptop (Python 3.12.10); this is that, kept.
  #
  # The order is the point. A plain install runs FIRST, before SWI-Prolog
  # exists on the runner, because that is the state a new user is in and the
  # one that used to end in another package's build error: thirty lines of
  # traceback ending in `RuntimeError: Failed to find SWI-Prolog components`,
  # and on Windows `The system was unable to find the specified registry key
  # or value`. It must now install cleanly and refuse at the first engine call
  # with words of ours. Only then is SWI installed and the engine extra added.
  platforms:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      # No SWI-Prolog yet, deliberately.
      - name: A plain install succeeds without SWI-Prolog
        run: |
          python -m venv plain
          case "${{ runner.os }}" in Windows) BIN=plain/Scripts ;; *) BIN=plain/bin ;; esac
          "$BIN/python" -m pip install --quiet --no-cache-dir dist/*.whl
          # Refuses at the first engine call, in our words, naming the fix.
          "$BIN/python" - <<'PY'
          from metta import MeTTa
          try:
              MeTTa()
          except Exception as error:                     # noqa: BLE001
              text = str(error)
              assert "SWI-Prolog" in text, text
              assert "pymetta[engine]" in text, text
              print("refused as designed:", text.splitlines()[0])
          else:
              raise SystemExit("the engine started with no SWI-Prolog installed")
          PY

      - name: Install SWI-Prolog
        run: |
          case "${{ runner.os }}" in
            macOS)   brew install swi-prolog ;;
            Windows) choco install swi-prolog --no-progress -y
                     # choco puts swipl under Program Files; the bridge's build
                     # reads the registry, and the CLI needs to be findable.
                     echo "/c/Program Files/swipl/bin" >> "$GITHUB_PATH"
                     # PATH is enough for the CLI, which finds its resources
                     # beside its own executable. It is NOT enough for janus,
                     # which loads libswipl into the PYTHON process, where
                     # that relative walk starts somewhere else entirely and
                     # the boot dies with "Could not find system resources".
                     # SWI_HOME_DIR is how an embedded runtime is told.
                     echo "SWI_HOME_DIR=C:\\Program Files\\swipl" >> "$GITHUB_ENV" ;;
          esac

      - name: The engine extra boots and round-trips JSON
        run: |
          python -m venv full
          case "${{ runner.os }}" in Windows) BIN=full/Scripts ;; *) BIN=full/bin ;; esac
          # janus_swi ships PREBUILT WHEELS for Windows, and a prebuilt one
          # carries its own idea of which SWI it links. Against the swipl this
          # job just installed that mismatch surfaces late and obscurely: the
          # boot got as far as loading the engine and then failed the
          # library(json) directive, because the resolver was reading a
          # different installation's library tree. Building janus from source
          # links it against THIS swipl, which is what the Linux matrix
          # already does for the same reason.
          case "${{ runner.os }}" in
            Windows) "$BIN/python" -m pip install --quiet --no-cache-dir \
                       --no-binary janus_swi "$(echo dist/*.whl)[engine]" ;;
            *)       "$BIN/python" -m pip install --quiet --no-cache-dir \
                       "$(echo dist/*.whl)[engine]" ;;
          esac
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$BIN/python" - <<'PY'
          from metta import MeTTa, _json
          answer = MeTTa().space().run("!(+ 1 2)")
          assert answer == [[3]], answer
          # The codec reaches this side through the engine's own alias, and an
          # installed layout is where a relative path stopped resolving.
          assert _json.loads(_json.dumps({"a": [1, 2]})) == {"a": [1, 2]}
          print("engine and codec answer on", __import__("platform").platform())
          PY

  # A wheel that boots in a clean environment is the only blackbox proof
  # that packaging works. The runtime resources setup.py copies into
  # metta/_runtime are exactly what a fresh install has to find.
  wheel:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mestto/metta-kernel-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build the source archive and the wheel
        # `python -m build` with no flag builds the sdist and then builds the
        # wheel FROM IT, which is the path PyPI takes and the one this job used
        # to skip. Measured 2026-08-23: `--wheel` alone succeeded while the full
        # build died on the MORK seat's control file, because MANIFEST.in
        # carried five fewer resources than setup.py's RUNTIME_RESOURCES maps
        # into the wheel. test_packaging.py holds that invariant statically;
        # this holds it for real.
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install FROM THE SOURCE ARCHIVE somewhere else and boot it
        # From the sdist rather than the wheel, deliberately: installing the
        # wheel we just built proves only that the wheel is loadable, while
        # installing the sdist re-runs the wheel build in the installer's own
        # environment, which is what a user without a matching wheel gets.
        run: |
          python -m venv /tmp/wheeltest
          # [engine] because the bridge to SWI-Prolog is an extra: a plain
          # install is the one that must not fail on a machine without SWI,
          # and this job boots the engine, so it needs the bridge.
          /tmp/wheeltest/bin/pip install --no-binary :all: "$(echo dist/*.tar.gz)[engine]"
          cd /tmp
          /tmp/wheeltest/bin/python -c "
          from pathlib import Path
          import metta
          from metta import MeTTa
          m = MeTTa()
          assert m.run('!(+ 1 2)') == [[3]], m.run('!(+ 1 2)')
          # The engine globs extensions/*/extension.pl on every boot, and
          # expand_file_name answers [] for a missing directory exactly as it
          # does for one holding no built seat. So an unshipped seam is
          # indistinguishable from an unbuilt seat at run time and only a
          # packaging check can tell them apart. It was unshipped until
          # 2026-08-17. The glob is spelled the way the engine spells it: the
          # per-seat folders arrived in f2387fee and this assertion kept the
          # older extensions/*.pl, which has matched nothing since.
          runtime = Path(metta.__file__).parent / '_runtime'
          for required in ('engine', 'lib', 'extensions'):
              assert (runtime / required).is_dir(), f'{required}/ missing from the wheel'
          assert list((runtime / 'extensions').glob('*/extension.pl')), 'extensions/ shipped empty'
          # The codec's golden corpus is data a third party reads out of an
          # installed tree to certify their own codec, so it ships or the kit
          # is checkout-only. Loaded rather than stat'ed, because a truncated
          # copy would pass a file test.
          from metta.testing import codec_corpus
          assert codec_corpus()['grammar'] == 'CODEC.md', 'the codec corpus did not ship'
          # metta.llms() prints the sheet that teaches this library, and a
          # reader who installed from PyPI has no checkout to read instead.
          # This install came from the SDIST, so it is the one place a
          # RUNTIME_RESOURCES entry MANIFEST.in does not carry shows up: the
          # wheel is built from the archive. The oracle is the checkout the
          # archive was built from, so a truncated copy fails as loudly as an
          # absent one.
          import contextlib, io, os
          printed = io.StringIO()
          with contextlib.redirect_stdout(printed):
              metta.llms()
          checkout = Path(os.environ['GITHUB_WORKSPACE']) / 'llms.txt'
          assert printed.getvalue() == checkout.read_text(encoding='utf-8'), 'llms.txt did not ship whole'
          print('wheel boots, evaluates outside the checkout, and carries the backend seam')
          "

      - name: Find the Pygments lexer through the installed entry point
        # The one door nobody imports: Pygments reads `pygments.lexers` from
        # installed distribution metadata, so a wheel is the only place the
        # declaration can be wrong in a way a checkout cannot show. Pygments is
        # installed here rather than depended on, because it is the precondition
        # of the load rather than something this package needs -- a reader gets
        # it with Sphinx, mkdocs, rich or IPython.
        run: |
          /tmp/wheeltest/bin/pip install pygments
          cd /tmp
          /tmp/wheeltest/bin/python -c "
          from pygments.lexers import (
              get_lexer_by_name, get_lexer_for_filename, get_lexer_for_mimetype,
          )
          from metta._pygments import MettaLexer
          for found in (get_lexer_by_name('metta'),
                        get_lexer_for_filename('x.metta'),
                        # what a Jupyter kernel's language_info names
                        get_lexer_for_mimetype('text/x-metta')):
              assert type(found) is MettaLexer, found
          coloured = [t for _, t, _ in MettaLexer().get_tokens_unprocessed('!(+ 1 2)')]
          assert len(set(coloured)) > 1, coloured
          print('the installed distribution registers the MeTTa lexer with Pygments')
          "

      - name: Build every extension package and find each through its entry point
        # The ruling of 2026-09-08 read from the installer's side. Every
        # library the Python seat can be extended by is its own distribution,
        # and a distribution that does not BUILD, or that builds without its
        # `metta.extensions` entry point, is a package no dispatch can ever
        # discover -- a failure a checkout cannot show, because a checkout
        # reaches a member by path and writes no metadata at all.
        #
        # Derived from the directory, so a package added under ext/ is built
        # here with no edit: the members are what the workspace glob matches.
        #
        # The FULL build rather than --wheel, and installed FROM THE SOURCE
        # ARCHIVE, for the reason the root package's own two steps give: `build`
        # with no flag makes the sdist and then the wheel from it, which is the
        # path PyPI takes, and `--wheel` alone once passed while the full build
        # died on a MANIFEST.in that carried five fewer resources than the
        # wheel mapped in. These are published as sdists too, so this is what
        # keeps a published sdist one that installs.
        run: |
          set -eu
          for member in ext/metta-*; do
              python -m build --outdir dist/ext "$member"
          done
          /tmp/wheeltest/bin/pip install --no-deps --no-binary :all: dist/ext/*.tar.gz
          cd /tmp
          /tmp/wheeltest/bin/python -c "
          import os
          from importlib import metadata
          from pathlib import Path

          from metta import seam

          checkout = Path(os.environ['GITHUB_WORKSPACE'])
          expected = {path.name for path in checkout.glob('ext/metta-*')}
          advertised = seam.advertised()
          assert set(advertised) == expected, (sorted(advertised), sorted(expected))
          # And each one LOADS through the entry point it advertised, which is
          # the door the seat opens on the first dispatch that needs it.
          for name in sorted(advertised):
              metadata.distribution(name)
              advertised[name].load()
          rows = {row.name for row in seam.rows() if row.source == 'package'}
          assert {'pandas', 'numpy', 'pyarrow'} <= rows, sorted(rows)
          print(len(advertised), 'extension packages built, installed and discovered')
          "

  # The upstream Jupyter kernel, started rather than read. Its own job because
  # it fetches trueagi-io/jupyter-petta-kernel from github.com, which the gate
  # refuses to do, and because it needs three things the gate has no use for:
  # the janus bridge, an ipykernel, and the upstream checkout to run the
  # kernel's own configuration against.
  #
  # The script is invoked DIRECTLY rather than through `sh tools/check.sh kernel`.
  # That lane is REPORT, and a REPORT failure is printed and forgiven, so
  # running it through the driver here would report a dead kernel as a green
  # job. CI=true is what turns every skip in it into a refusal.
  kernel:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mestto/metta-kernel-ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the pinned upstream PeTTa beside the repository
        # The kernel's OWN configuration is a PeTTa tree in upstream's layout,
        # which is what `PETTA_PATH` names; the same pin the parity lanes use.
        run: |
          set -eu
          upstream="$(dirname "$GITHUB_WORKSPACE")/PeTTa-upstream"
          pin=ae66fa8e41dcd5539d614706bd4e5cfb34f9608d
          mkdir -p "$upstream"
          git -C "$upstream" init -q
          git -C "$upstream" remote add origin https://github.com/trueagi-io/PeTTa
          git -C "$upstream" fetch -q --depth 1 origin "$pin"
          git -C "$upstream" checkout -q FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$pin"

      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package, the engine bridge and a Jupyter client
        # ipykernel, nbclient and nbformat are not extras of this package: the
        # kernel is somebody else's and this job is the only thing here that
        # runs one. janus-swi comes from the `engine` extra, and the kernel
        # boots the engine through it in-process.
        run: |
          uv sync --locked --all-packages --extra checks --extra engine
          uv pip install ipykernel nbclient nbformat

      - name: Start the upstream kernel against upstream and against this engine
        run: ${{ github.workspace }}/.venv/bin/python tests/checks/check_jupyter_kernel.py
