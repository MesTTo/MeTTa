# Purpose: publish every distribution this repository releases, pymetta and
#   each member under ext/, to PyPI. The files come from one of two sources:
#   the build and host jobs make them when a version tag is pushed, or, when
#   the workflow is dispatched with `assets`, the fetch job takes the files
#   attached to that GitHub Release exactly as they are. Both sources hand on
#   the same two artifacts, so everything after them is one path: plan which
#   projects PyPI already has, check that every published entry point still
#   resolves, publish the existing projects in upload order, then create the
#   missing ones.
#
# No token is stored anywhere. PyPI's Trusted Publishing mints a short-lived
# credential for this exact repository and workflow through OIDC, so there is
# no secret to leak, rotate, or accidentally commit; `id-token: write` is what
# lets the job ask for it.
#
# The distributions are built the way checks.yml's packaging job builds them,
# `python -m build` with no flag, which builds the sdist and then the wheel
# FROM IT. That is the path PyPI itself takes, and building only the wheel
# hides a MANIFEST.in that ships fewer resources than the wheel maps in.
#
# The gate is not re-run here. A tag is pushed at a commit whose checks
# already passed, and re-running them would publish on a different tree than
# the one that went green.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      assets:
        description: >-
          The tag of a GitHub Release whose attached files are published as
          they are, with nothing built here. Its tag must not start with v.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The building source: build, then host. An assets run skips both, and the
  # fetch job below supplies the same two artifacts instead.
  build:
    if: inputs.assets == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Verify the public lint authority
        run: |
          python - <<'PY'
          import ast
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          module = ast.parse(Path("extensions/python/metta/_spaces/intents.py").read_text())
          assignment = next(
              node
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "_LINT_CATALOGUE"
                  for target in node.targets
              )
          )
          authority = ast.literal_eval(assignment.value)
          parsed = urlsplit(authority)
          owner, repository, marker, commit, *path = parsed.path.strip("/").split("/")
          if parsed.netloc != "github.com" or marker != "blob" or len(commit) != 40:
              raise SystemExit(f"invalid public lint authority: {authority}")
          raw = f"https://raw.githubusercontent.com/{owner}/{repository}/{commit}/{'/'.join(path)}"
          with urllib.request.urlopen(raw) as response:
              catalogue = response.read().decode()
          if "## Lint a space" not in catalogue or "operation-crossing-in-loop" not in catalogue:
              raise SystemExit(f"lint catalogue is absent from {raw}")
          PY
      - name: Build every distribution
        # pymetta and the packages under ext/ are all their own distributions,
        # and before this the workflow published only pymetta, so releasing
        # them was seventeen twine invocations by hand. They ride the same
        # dist/ directory and therefore the same publish step.
        #
        # The loop lives in tools/build-distributions.sh rather than here, so
        # that a release can be built locally by the same code that builds it
        # on the runner. It was four lines of YAML, and reproducing them by
        # hand is how a dist/ gets staged with `cp` from wherever the last
        # build happened to leave things.
        #
        # It reads the member list from the directory, so a package added
        # under ext/ is released with no edit anywhere. Their versions are
        # deliberately INDEPENDENT of pymetta's: an integration releasing on
        # its own is the shape Airflow's providers have, which is the
        # precedent the extras are modelled on, so the tag check below names
        # pymetta's own archive rather than whatever is in dist/.
        #
        # pymetta's manylinux wheels are not built here: the host job below
        # grafts the patched SWI-Prolog onto the pure wheel this step builds.
        #
        # CHECK_PY names the interpreter that just received `build`, rather
        # than letting the script's own search pick a different python3.
        run: |
          python -m pip install --upgrade pip build
          CHECK_PY=$(command -v python) sh tools/build-distributions.sh
          ls -la dist/

      - name: The tag and the packaged version must agree
        # A tag that disagrees with pyproject's version publishes something
        # nobody asked for, and PyPI will not let it be replaced afterwards.
        # Only a TAG carries a version to check: under workflow_dispatch
        # GITHUB_REF_NAME is a branch name, and comparing it to the built
        # version failed every manual run before it could publish.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          # pymetta's OWN archive by name. `dist/*.tar.gz` matched one file
          # when this job built one distribution and matches eighteen now, and
          # the sed over all of them produced a version string no comparison
          # could pass. The glob must name exactly one file, since the version
          # is read from that one name.
          set -- dist/pymetta-*.tar.gz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one pymetta sdist in dist/, found: $*" >&2
            exit 1
          fi
          built=${1#dist/pymetta-}
          built=${built%.tar.gz}
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME carries $tagged, the build carries $built" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  # pymetta's Linux wheels, which `python -m build` cannot make: the pure
  # wheel from the build job with a patched SWI-Prolog grafted in as
  # metta/_host, compiled inside quay.io/pypa/manylinux_2_28_x86_64, one wheel
  # per interpreter. tools/pymetta-host/fetch-source.sh clones swipl-devel at
  # the pinned commit and applies every patch this repository carries, and
  # declare-host.sh records them in the home, so the runner needs nothing but
  # Docker, which ubuntu-latest has. These are files of the pymetta
  # distribution, not a distribution of their own: a separate pymetta-host
  # was retired on 2026-09-23, after PyPI never created it and 0.9.1's engine
  # extra named it anyway.
  #
  # Its own job because it takes tens of minutes; it waits for the build job
  # only for the pure wheel it grafts onto.
  host:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Graft the patched host into pymetta's manylinux wheels
        # bash, the interpreter run.sh's own shebang names.
        run: DIST="$PWD/dist" bash tools/pymetta-host/run.sh build-swipl.sh build-janus.sh assemble.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-distributions
          path: ai-tmp/host-build/dist/

  # THE OTHER SOURCE: FILES BUILT AND VERIFIED ELSEWHERE.
  #
  # Some uploads cannot leave the machine that built them. PyPI's upload host
  # is one AWS region, and a single connection to it from far away runs at
  # tens of kB/s, under which a 24 MB manylinux wheel fails with 500 Internal
  # Server Error before it is sent [measured 2026-09-24: 40 to 90 kB/s to
  # upload.pypi.org from the machine that built 0.9.2, 1.28 MB/s to
  # uploads.github.com from the same machine; eight 500s over two twine
  # attempts at pymetta-0.9.2-cp312's manylinux wheel]. Dispatching with
  # `assets` names a GitHub Release, and this job hands its attached files on
  # as the two artifacts the build and host jobs would have made, so the files
  # someone verified are the files PyPI receives. Nothing is built here.
  #
  # The Release must carry every distribution the tree releases, as a build
  # does; the resolvable job refuses one that is missing and a file no
  # distribution owns. Its tag must not start with v, or creating it would
  # start the building run beside this one.
  fetch:
    if: inputs.assets != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download the Release's files
        # The manylinux wheels go to the artifact the host job makes, so every
        # job after this reads one layout whichever source ran. A Release
        # without them fails here, since pymetta's pure wheel published alone
        # would leave a Linux x86_64 reader an engine that refuses to boot.
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ inputs.assets }}
        run: |
          case "$ASSETS" in v*) echo "a tag starting with v also starts the building run" >&2; exit 1 ;; esac
          gh release download "$ASSETS" --repo "$GITHUB_REPOSITORY" --dir dist
          mkdir -p host-dist
          mv dist/pymetta-*-manylinux_*.whl host-dist/
          ls -la dist host-dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: host-distributions
          path: host-dist/
          if-no-files-found: error

  # WHICH DISTRIBUTIONS HAVE NO PYPI PROJECT YET.
  #
  # A project that does not exist cannot be published by the `publish` job
  # below, because a trusted publisher cannot be attached to a project that
  # is not there. PyPI's answer is a PENDING publisher, which creates the
  # project on first use and, for an account that is not an organization,
  # does so with ratelimited=False -- it never consults the project-creation
  # limiter that has blocked every upload attempt here since 2026-09-21
  # [source: warehouse oidc/views.py and packaging/services.py].
  #
  # PyPI allows only ONE pending publisher per
  # (owner, repository, workflow, environment), across different project
  # names, and at most THREE pending at a time. Both are measured, not read.
  # So each new project is registered against its OWN environment, named
  # pypi-<project>, and this job presents one claim set per project in a
  # single run. Three land per round; reified publishers stop counting
  # against the cap, so the next round registers the next three.
  #
  # tools/pending-publishers.py prints exactly what to register and emits
  # this matrix, so the environment a row is registered under and the
  # environment this job presents come from one function rather than two
  # places that can drift.
  #
  # It reads PyPI and the tree, never the files, so it waits for neither
  # source and runs beside whichever one this run uses.
  plan:
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      deferred: ${{ steps.plan.outputs.deferred }}
      steady: ${{ steps.plan.outputs.steady }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan reads the distribution list, which is a glob over
          # ext/*/pyproject.toml. Without the components that glob is empty,
          # so the bootstrap matrix would be empty and the job would succeed
          # having registered nothing.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - id: plan
        # One pass over PyPI for both halves, so they cannot disagree about
        # which job owns a project. `deferred` carries the planner's rows, as
        # `bootstrap` does, so the files of a project waiting for a later
        # round are found by the stem the planner computed.
        run: |
          plan=$(python tools/pending-publishers.py --json-plan)
          {
            printf 'bootstrap=%s\n' "$(printf '%s' "$plan" | jq -c .bootstrap)"
            printf 'steady=%s\n' "$(printf '%s' "$plan" | jq -r '.steady | join(" ")')"
            printf 'deferred=%s\n' "$(printf '%s' "$plan" | jq -c .deferred)"
          } >> "$GITHUB_OUTPUT"
          python tools/pending-publishers.py

  # WHETHER A READER CAN STILL INSTALL WHAT THIS RUN LEAVES BEHIND.
  #
  # `plan` asks PyPI whether a PROJECT EXISTS, which is a different question
  # from whether `pip install "pymetta[engine]"` resolves: pymetta 0.9.1
  # passed the first and fails the second on Linux x86_64, because its engine
  # extra named a pymetta-host that does not exist, and a version is never
  # freed once uploaded. So one job resolves every entry point this run leaves
  # behind, on every platform row and interpreter, against the live index plus
  # exactly the files the two upload jobs below send: the steady projects and
  # this round's bootstrap ones, not the deferred rounds' files, which nothing
  # here uploads. The new projects, this round's and the later rounds', are
  # acknowledged with --awaiting, so a cell failing only because one of them
  # is not on the index yet is reported apart and does not fail the run, while
  # any other failure does. Both upload jobs wait for it.
  #
  # Staging also accounts for every file: each one is uploaded by this run or
  # belongs to a project a later round creates. A file owned by no
  # distribution of this tree, which only a hand-assembled Release can hold,
  # stops the run rather than being left behind unnoticed.
  #
  # One source is always skipped, and a job whose needs include a skipped job
  # is skipped too unless its condition calls a status function. `!failure()`
  # runs this after whichever source ran, and not after one that failed.
  resolvable:
    needs: [build, host, fetch, plan]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: staged/
      - uses: actions/download-artifact@v4
        with:
          name: host-distributions
          path: staged/
      - name: Stage exactly what this run uploads
        run: |
          mkdir -p dist later
          for stem in ${{ needs.plan.outputs.steady }}; do mv staged/"$stem"-* dist/; done
          for stem in $(printf '%s' '${{ needs.plan.outputs.bootstrap }}' | jq -r '.[].stem'); do
            mv staged/"$stem"-* dist/
          done
          for stem in $(printf '%s' '${{ needs.plan.outputs.deferred }}' | jq -r '.[].stem'); do
            mv staged/"$stem"-* later/
          done
          leftover=$(ls staged)
          if [ -n "$leftover" ]; then
            echo "files no distribution of this tree owns: $leftover" >&2
            exit 1
          fi
          ls -la dist/
      - name: Every published entry point must still resolve
        run: |
          python -m pip install --upgrade uv packaging
          awaiting=()
          for project in $(printf '%s' '${{ needs.plan.outputs.bootstrap }}' '${{ needs.plan.outputs.deferred }}' | jq -r '.[].project'); do
            awaiting+=(--awaiting "$project")
          done
          python tests/checks/check_release_resolvable.py --upload dist/ "${awaiting[@]}"

  # The half of the partition PyPI already has a project for. It must be a
  # half rather than the whole directory, because the token this environment
  # mints is scoped to the projects its publisher covers, and a file belonging
  # to a project that does not exist yet is a 403 that fails the upload for
  # everything behind it. skip-existing covers a file PyPI already holds; it
  # does not cover one we are not allowed to send.
  #
  # Every upload here skips a filename PyPI already holds. The distributions'
  # versions move INDEPENDENTLY, so a release normally includes files PyPI
  # has, and twine fails the whole upload on the first such file, so the
  # distributions after it never go out. Skipping is also the only safe
  # reading, because a version is never freed.
  #
  # The upload order never leaves a reader a worse install than before:
  # pymetta's manylinux wheels, then its pure wheel, then its sdist, then the
  # members that pin it. A Linux x86_64 reader installing mid-run gets either
  # the previous release or a wheel carrying its host, never the pure wheel
  # alone, and no member arrives pinning a pymetta the index does not have yet.
  publish:
    needs: [build, host, fetch, plan, resolvable]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.steady != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: staged/
      - uses: actions/download-artifact@v4
        with:
          name: host-distributions
          path: staged/
      - name: Keep only the projects that already exist, in upload order
        run: |
          mkdir -p dist 1-linux 2-pure 3-sdist 4-members
          for stem in ${{ needs.plan.outputs.steady }}; do
            mv staged/"$stem"-* dist/
          done
          find dist -maxdepth 1 -name 'pymetta-*-manylinux_*.whl' -exec mv {} 1-linux/ \;
          find dist -maxdepth 1 -name 'pymetta-*-py3-none-any.whl' -exec mv {} 2-pure/ \;
          find dist -maxdepth 1 -name 'pymetta-*.tar.gz' -exec mv {} 3-sdist/ \;
          find dist -maxdepth 1 -type f -exec mv {} 4-members/ \;
          ls -la 1-linux 2-pure 3-sdist 4-members
      - name: pymetta's manylinux wheels
        if: hashFiles('1-linux/*') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: 1-linux/
          skip-existing: true
      - name: pymetta's pure wheel
        if: hashFiles('2-pure/*') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: 2-pure/
          skip-existing: true
      - name: pymetta's sdist
        if: hashFiles('3-sdist/*') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: 3-sdist/
          skip-existing: true
      - name: The members that pin it
        if: hashFiles('4-members/*') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: 4-members/
          skip-existing: true

  # One job per project PyPI does not have, each in its own environment so
  # its pending publisher matches. fail-fast is off because a project whose
  # publisher has not been registered yet fails only its own job, and that
  # failure is the accurate signal that it is still waiting for a slot.
  #
  # It waits for publish, for the reason the upload order gives: a new member
  # pins the pymetta of its own release, which has to be on the index first,
  # so a failed publish holds every new project back.
  bootstrap:
    needs: [build, host, fetch, plan, resolvable, publish]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.bootstrap != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.bootstrap) }}
    environment: ${{ matrix.target.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: staged/
      - uses: actions/download-artifact@v4
        with:
          name: host-distributions
          path: staged/
      - name: Keep only this project's own files
        # The OIDC token a pending publisher mints is scoped to that project
        # alone, so uploading the whole directory would 403 on the first file
        # belonging to anything else. `stem` comes from the planner rather
        # than being re-derived here, because "hyphens become underscores in
        # a built filename" is a packaging rule and a second copy of it in
        # YAML is one that can drift.
        run: |
          mkdir -p dist
          mv staged/${{ matrix.target.stem }}-* dist/
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
