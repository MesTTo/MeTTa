# Purpose: publish pymetta to PyPI when a version tag is pushed.
#
# No token is stored anywhere. PyPI's Trusted Publishing mints a short-lived
# credential for this exact repository and workflow through OIDC, so there is
# no secret to leak, rotate, or accidentally commit; `id-token: write` is what
# lets the job ask for it.
#
# The distributions are built the way checks.yml's packaging job builds them,
# `python -m build` with no flag, which builds the sdist and then the wheel
# FROM IT. That is the path PyPI itself takes, and building only the wheel
# hides a MANIFEST.in that ships fewer resources than the wheel maps in.
#
# The gate is not re-run here. A tag is pushed at a commit whose checks
# already passed, and re-running them would publish on a different tree than
# the one that went green.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Verify the public lint authority
        run: |
          python - <<'PY'
          import ast
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          module = ast.parse(Path("extensions/python/metta/_spaces/intents.py").read_text())
          assignment = next(
              node
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "_LINT_CATALOGUE"
                  for target in node.targets
              )
          )
          authority = ast.literal_eval(assignment.value)
          parsed = urlsplit(authority)
          owner, repository, marker, commit, *path = parsed.path.strip("/").split("/")
          if parsed.netloc != "github.com" or marker != "blob" or len(commit) != 40:
              raise SystemExit(f"invalid public lint authority: {authority}")
          raw = f"https://raw.githubusercontent.com/{owner}/{repository}/{commit}/{'/'.join(path)}"
          with urllib.request.urlopen(raw) as response:
              catalogue = response.read().decode()
          if "## Lint a space" not in catalogue or "operation-crossing-in-loop" not in catalogue:
              raise SystemExit(f"lint catalogue is absent from {raw}")
          PY
      - name: Build every distribution
        # pymetta and the packages under ext/ are all their own distributions,
        # and before this the workflow published only pymetta, so releasing
        # them was seventeen twine invocations by hand. They ride the same
        # dist/ directory and therefore the same publish step.
        #
        # The loop lives in tools/build-distributions.sh rather than here, so
        # that a release can be built locally by the same code that builds it
        # on the runner. It was four lines of YAML, and reproducing them by
        # hand is how a dist/ gets staged with `cp` from wherever the last
        # build happened to leave things.
        #
        # It reads the member list from the directory, so a package added
        # under ext/ is released with no edit anywhere. Their versions are
        # deliberately INDEPENDENT of pymetta's: an integration releasing on
        # its own is the shape Airflow's providers have, which is the
        # precedent the extras are modelled on, so the tag check below names
        # pymetta's own archive rather than whatever is in dist/.
        #
        # ext/pymetta-host is skipped BY NAME in that script. It carries a
        # patched SWI-Prolog built inside quay.io/pypa/manylinux_2_28_x86_64,
        # one wheel per interpreter, which is tools/pymetta-host/run.sh and
        # needs a container this runner does not have.
        #
        # CHECK_PY names the interpreter that just received `build`, rather
        # than letting the script's own search pick a different python3.
        run: |
          python -m pip install --upgrade pip build
          CHECK_PY=$(command -v python) sh tools/build-distributions.sh
          ls -la dist/

      - name: The tag and the packaged version must agree
        # A tag that disagrees with pyproject's version publishes something
        # nobody asked for, and PyPI will not let it be replaced afterwards.
        # Only a TAG carries a version to check: under workflow_dispatch
        # GITHUB_REF_NAME is a branch name, and comparing it to the built
        # version failed every manual run before it could publish.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          # pymetta's OWN archive by name. `dist/*.tar.gz` matched one file
          # when this job built one distribution and matches eighteen now, and
          # the sed over all of them produced a version string no comparison
          # could pass.
          built=$(ls dist/pymetta-*.tar.gz | sed -E 's/.*pymetta-(.*)\.tar\.gz/\1/')
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME carries $tagged, the build carries $built" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  # WHICH DISTRIBUTIONS HAVE NO PYPI PROJECT YET.
  #
  # A project that does not exist cannot be published by the `publish` job
  # below, because a trusted publisher cannot be attached to a project that
  # is not there. PyPI's answer is a PENDING publisher, which creates the
  # project on first use and, for an account that is not an organization,
  # does so with ratelimited=False -- it never consults the project-creation
  # limiter that has blocked every upload attempt here since 2026-09-21
  # [source: warehouse oidc/views.py and packaging/services.py].
  #
  # PyPI allows only ONE pending publisher per
  # (owner, repository, workflow, environment), across different project
  # names, and at most THREE pending at a time. Both are measured, not read.
  # So each new project is registered against its OWN environment, named
  # pypi-<project>, and this job presents one claim set per project in a
  # single run. Three land per round; reified publishers stop counting
  # against the cap, so the next round registers the next three.
  #
  # tools/pending-publishers.py prints exactly what to register and emits
  # this matrix, so the environment a row is registered under and the
  # environment this job presents come from one function rather than two
  # places that can drift.
  plan:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
      steady: ${{ steps.plan.outputs.steady }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - id: plan
        # One pass over PyPI for both halves, so they cannot disagree about
        # which job owns a project.
        run: |
          plan=$(python tools/pending-publishers.py --json-plan)
          printf 'bootstrap=%s\n' "$(printf '%s' "$plan" | jq -c .bootstrap)" >> "$GITHUB_OUTPUT"
          printf 'steady=%s\n' "$(printf '%s' "$plan" | jq -r '.steady | join(" ")')" >> "$GITHUB_OUTPUT"
          python tools/pending-publishers.py

  # One job per project PyPI does not have, each in its own environment so
  # its pending publisher matches. fail-fast is off because a project whose
  # publisher has not been registered yet fails only its own job, and that
  # failure is the accurate signal that it is still waiting for a slot.
  bootstrap:
    needs: [build, plan]
    if: needs.plan.outputs.bootstrap != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.bootstrap) }}
    environment: ${{ matrix.target.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: staged/
      - name: Keep only this project's own files
        # The OIDC token a pending publisher mints is scoped to that project
        # alone, so uploading the whole directory would 403 on the first file
        # belonging to anything else. `stem` comes from the planner rather
        # than being re-derived here, because "hyphens become underscores in
        # a built filename" is a packaging rule and a second copy of it in
        # YAML is one that can drift.
        run: |
          mkdir -p dist
          mv staged/${{ matrix.target.stem }}-* dist/
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The other half of the partition: every distribution PyPI already has a
  # project for. It must be a half rather than the whole directory, because
  # the token this environment mints is scoped to the projects its publisher
  # covers, and a file belonging to a project that does not exist yet is a
  # 403 that fails the upload for everything behind it. skip-existing covers
  # a file PyPI already holds; it does not cover one we are not allowed to
  # send.
  publish:
    needs: [build, plan]
    if: needs.plan.outputs.steady != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: staged/
      - name: Keep only the projects that already exist
        run: |
          mkdir -p dist
          for stem in ${{ needs.plan.outputs.steady }}; do
            mv staged/"$stem"-* dist/
          done
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # dist/ carries every distribution this repository releases and
          # their versions move INDEPENDENTLY, so a release normally includes
          # files PyPI already has. twine fails the whole upload on the first
          # such file, and the distributions after it never go out. That is
          # the tree's state right now: 5 of the 18 are published and a re-run
          # of this job would die on pymetta-0.9.0 before reaching any of the
          # 13 that are missing. Skipping a filename PyPI already holds is
          # also the only safe reading, because a version is never freed.
          skip-existing: true
