# Purpose: Defines MeTTa packaging, dependencies, tool policy, and verification contracts.
# Assumes: Packaging and gate commands run from the repository root with extensions/python importable.
# Guarantees: Static import contracts keep the narrow core independent of optional satellites,
#   while excluding annotations that cannot execute and naming every deferred boundary crossing.
# Decides: metta._space is core; metta._world, metta._saga,
#   metta._persistent, and public integration modules
#   are satellites; TYPE_CHECKING-only imports do not form runtime dependencies.
# [tested: cd extensions/python && PYTHONPATH=$PWD lint-imports; commit=350c0d9dbd3c78a4f779d6331e223e939b94c2c8]
# Decides: NetworkX and NumPy are test-only infrastructure because the
# blocking gallery executes them, while the core distribution remains
# dependency-free of them.
# [tested: test_optional_integrations_have_installable_extras,
# test_minimal_version_matrix_installs_blocking_gallery_dependency;
# commit=8bfe05c3850776543ece25a85038242f10b1d841]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "pymetta"
dynamic = ["version"]
description = "MeTTa in Python, on a SWI-Prolog engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
#: Runtime, by the test that decides it: delete one, ship the wheel, and a
#: user's program stops working. Neither is imported by `import metta` --
#: measured, both absent from sys.modules after it -- but `metta.ops` and
#: `metta._space_definitions` reach `_documentation`, and that is mainstream
#: use, not an optional feature.
#: The `<0.18` cap on docstring-parser is gone as of 2026-08-28. It was
#: introduced with the typed-documentation work (bd23e0ee) with no recorded
#: reason and had come to exclude the CURRENT release: 0.18.0 is the latest.
#: Measured against it rather than assumed -- the two names this library uses,
#: DocstringStyle and parse, are present and parse identically, and the whole
#: pytest gate passes on 0.18.0 -- so the bound was costing a user a resolver
#: conflict and buying nothing. janus-swi has never carried an upper bound and
#: this now matches it.
#: janus-swi is NOT here, and that is the whole of what makes a failed install
#: legible. It is the bridge to SWI-Prolog, it has no wheel on Linux or macOS,
#: and its sdist refuses to build when SWI is absent -- inside pip's isolated
#: subprocess, before any of this package exists. So requiring it meant
#: `pip install pymetta` on a machine without SWI died in someone else's
#: setup.py: measured 2026-08-29 on macOS 26.4.1 and on Windows, thirty lines
#: of traceback ending in `RuntimeError: Failed to find SWI-Prolog components`,
#: and on Windows `The system was unable to find the specified registry key`.
#: Nothing of ours ran, so nothing of ours could explain it.
#: As an extra, `pip install pymetta` always succeeds and the FIRST engine call
#: raises _engine._no_engine's refusal, which names the platform's install
#: command and the reinstall that follows it. The engine is a program rather
#: than a Python package either way; this only decides who gets to say so.
dependencies = [
    "docstring-parser>=0.17",
]
classifiers = [
    # This is alpha because MeTTa is, and this is that statement in PyPI's own
    # vocabulary, so an installer reading nothing but the metadata is told what
    # SECURITY.md and CONTRIBUTING.md tell a reader.
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Prolog",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/MesTTo/MeTTa-Kernel"
Repository = "https://github.com/MesTTo/MeTTa-Kernel"
Issues = "https://github.com/MesTTo/MeTTa-Kernel/issues"

[project.entry-points.pytest11]
metta = "metta.pytest_plugin"

[project.scripts]
metta = "metta.cli:main"

[project.optional-dependencies]
#: The bridge to SWI-Prolog. Named so `pip install pymetta[engine]` is one
#: command for a reader who already has SWI, while a plain install stays the
#: one that cannot fail before this package can speak for itself.
engine = [
    "janus-swi>=1.5.2",
]
arrays = [
    "array-api-compat",
    "faiss-cpu",
    "numpy",
]
das = [
    "websocket-client",
]
dataframes = [
    "pandas",
    "polars",
]
test = [
    "hypothesis>=6.165",
    "networkx>=3.6,<4",
    "numpy",
    "pytest>=8.4.2",
    "pytest-benchmark>=5.2",
    #: Ordering and the per-item wall bound, which the suite's configuration
    #: reads: pytest-randomly shuffles every run so a test cannot depend on the
    #: one before it, and pytest-timeout ends an item that is stuck rather than
    #: slow. Both are in `test` rather than in `checks` because they change what
    #: the SUITE does, and CI installs `test` to run it.
    "pytest-randomly>=5",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8,<4",
]
#: Everything `test` installs, plus the linters. Written as the self-reference
#: PEP 508 gives for exactly this, rather than repeating six pins that then have
#: to be kept equal by hand: `checks` is a strict superset of `test`, and saying
#: so once is the only spelling where the two cannot drift.
checks = [
    "pymetta[test]",
    "bandit>=1.9",
    "codespell>=2.4",
    #: The `coverage` REPORT lane. pytest-cov is what carries coverage across
    #: the four xdist workers, each of which is a separate process with its own
    #: engine; `coverage run -m pytest` alone measures the controller and none
    #: of them.
    "coverage[toml]>=7.15",
    "deptry>=0.25",
    "import-linter>=2.13",
    "interrogate>=1.7",
    "mypy>=1.18",
    #: The `mutation` REPORT lane, one module per run.
    "mutmut>=3.7",
    "perflint>=0.8",
    "pip-audit>=2.9",
    "pylint>=3.3,<4",
    #: The `verifytypes` REPORT lane: how much of the published surface a type
    #: checker can see a type for. A different question from mypy's, which asks
    #: whether the annotations that ARE there hold.
    "pyright>=1.1.411",
    "pytest-cov>=7",
    "radon>=6.0",
    "refurb>=2.3",
    "ruff>=0.14",
    "setuptools>=83",
    "slotscheck>=0.20",
    "ty>=0.0.1a20",
    "vulture>=2.16",
    "xenon>=0.9",
]

[tool.setuptools]
packages = ["metta"]
package-dir = {"" = "extensions/python"}
include-package-data = true

[tool.setuptools.package-data]
metta = ["*.pyi", "shim.pl", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "metta._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
# The suite's one root, so a run given only FLAGS still collects it.
# extensions/python/test.sh used to spell `tests` as a trailing argument and
# drop it whenever the caller passed anything at all, so
# `sh extensions/python/test.sh -n 0 --durations=25` collected the whole of
# extensions/python -- benchmarks/conftest.py included -- and died in
# collection with `PluginValidationError: unknown hook
# 'pytest_benchmark_update_machine_info'`, because the same command disables the
# benchmark plugin [measured 2026-09-06]. pytest is the one that can tell a path
# argument from a flag, so the default belongs here and the runner passes "$@"
# unchanged. tests/checks/evidence_runners.py READS this value and reports it
# when it stops naming the pytest collector's own root.
testpaths = ["tests"]

# Every thread's stack when an item runs long, dumped from faulthandler's own C
# watchdog thread, so it reaches a main thread sitting inside a Prolog crossing
# where no Python bytecode runs. It DUMPS and does not fail: a slow test stays
# green and a stuck one says where it is.
#
# 180 seconds is twice the slowest test measured on this box in the gate's own
# four-worker configuration -- 89.78s,
# tests/repository/test_host_carve.py::test_the_python_binding_calls_only_the_published_host_surface,
# at loadavg 43 [measured 2026-09-06, `-n 4 --dist loadfile --durations=25`] --
# so ordinary load variation on a box that idles at 25-35 cannot reach it.
faulthandler_timeout = 180

# The bound that ends a stuck item. Three properties decide the number:
#   - above every bound a test enforces on its own children, the largest being
#     600s in tests/ch01_getting_started/test_packaging.py::_build_ext, so the
#     test's own TimeoutExpired -- which prints the child's output -- always
#     wins the race and this only ever fires on something genuinely stuck;
#   - ten times the slowest test measured (89.78s at loadavg 43);
#   - a quarter of bounded.sh's 3600s ceiling, so a stuck item is NAMED, with
#     every thread's stack, long before the anonymous session kill.
timeout = 900

# thread, measured rather than assumed. The engine is embedded in this process
# and the main thread sits inside PL_next_solution for the length of a crossing,
# where CPython cannot run a Python-level signal handler:
#   - signal, --timeout=5 against `janus_swi.query_once("sleep(30)")`: the run
#     took 30.18s and reported `Failed: Timeout (>5.0s)` only when sleep/1
#     RETURNED, so a crossing that never returns is never bounded at all;
#   - signal, --timeout=5 against a hang in a Python callback reached from
#     Prolog: it fires, and the Failed it raises comes back out of the crossing
#     as a PrologError, so the report names the engine rather than the timeout;
#   - thread, the same 30-second crossing: 5.41s wall, exit 1, and the dump
#     names janus.py:245 query_once -> _swipl.call.
# [measured 2026-09-06; the two probe files are in the journal entry
# docs/journal/2026-09-06-a-suite-that-cannot-hide-a-crash.md]
# thread ends the process with os._exit(1) after printing every thread's stack.
# It therefore never unwinds a live crossing, which is what the signal method
# does and what leaves the engine's next call answering for the wrong reason.
# Under --dist loadfile each worker owns one engine, so the kill is contained,
# and --max-worker-restart=0 turns it into a loud session failure rather than a
# retried flake.
timeout_method = "thread"

# A warning is a failure unless this file says otherwise, and each exception
# carries the reason it is one. Later entries win, which is why the unraisable
# rule sits last.
filterwarnings = [
    "error",
    # ResourceWarning is raised from __del__ and from weakref finalizers, so it
    # is delivered whenever the collector happens to run and is attributed to
    # whichever test is running then -- an order-dependent failure by
    # construction, in a suite whose whole point here is to have none. Making it
    # fatal also raises INSIDE the finalizer, which abandons the cleanup that
    # finalizer was running: measured 2026-09-06, `-W error` over the suite gave
    # 125 failures and 54 errors, of which 43 were one library diagnostic
    # ("an open metta Cursor was discarded") and 42 more were the
    # PytestUnraisableExceptionWarning cascade from raising inside __del__;
    # demoting this one category left 3. The contract itself is tested at its
    # own door, where a test that means to see the warning catches it
    # (tests/ch04_spaces_and_matching/test_variadic_doors.py,
    # tests/ch20_extending_the_engine/test_deprecation_catalog.py), so nothing
    # is lost by not also making it fatal everywhere else.
    "ignore::ResourceWarning",
    # bandit's extension loader calls pkg_resources with an argument setuptools
    # has retired. It is reached by importlib.util.find_spec("bandit") in
    # test_every_module_invocation_in_the_gate_reaches_an_entry_point, which
    # imports every `python -m` target the gate names, so the warning is
    # bandit's and the fix is bandit's
    # [source: bandit/core/extension_loader.py:29 load_formatters].
    "ignore:The verify_requirements argument is now a no-op:DeprecationWarning",
    # pytest-benchmark declares an option with argparse.FileType, which Python
    # 3.14 deprecates. It fires while pytest registers the plugin, before any
    # test runs, so it is unreachable from this repository
    # [source: pytest_benchmark/plugin.py:260 pytest_addoption].
    "ignore:FileType is deprecated:PendingDeprecationWarning",
    # Last, so no entry above can soften it. An exception that CPython cannot
    # raise -- one escaping __del__, a weakref callback or a thread bootstrap --
    # is otherwise printed to stderr and the test still passes. This week's
    # finaliser crashes were unraisable exceptions before they were
    # segmentation faults.
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples/**/_common.py"]

[tool.ruff.lint]
# Refurb owns these newer rules. Ruff must preserve their targeted ``noqa``
# directives even though this Ruff version does not implement the codes.
external = ["FURB104", "FURB141", "FURB143"]
select = [
    "F",
    "E", "W",
    "I",
    "UP",
    "B",
    "BLE",
    "S",
    "PL",
    "RUF",
    "FURB",
    "PYI",
    "SIM",
    "C4",
    "PTH",
    "RET",
    "FBT",
    "N",
    "A",
    "ARG",
    "D",
    "PERF",
    "C90",
    "TRY",
    "EM",
]
ignore = [
    "E501",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.mccabe]
# Generous by ruling (user, 2026-08-24): the limit exists to catch a function
# nobody can follow, not to tax a readable dispatch ladder into helper
# fragments. xenon's absolute-D bound remains the real shape gate.
#
# RAISED 2026-08-31, 15 to 35, by the same ruling restated: a dispatch ladder
# that grows one arm should not have to be broken up to keep a counter happy.
# The functions over 15 are ladders of exactly that kind, each arm short and
# independent: evidence_runners.executed at 32 and
# check_evidence_tags._python_targets at 23. 35 sits above the largest, so what
# still trips this is a function that grew past every one of them rather than
# one that gained a case.
max-complexity = 35

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "PLW", "SIM", "RUF059", "PLC0415"]
# A language-feature example mirrors ITS MeTTa example's program, so the
# simplifications ruff offers there are requests to stop mirroring it:
# 05-if4.metta really does read `(if (== 42 42) True False)`, and its Python
# has to as well or the file no longer answers the program it names. The
# corpus carried these ignores through `tests/**` while it lived under that
# directory; the entry is spelled out now that it sits beside the other
# examples.
"examples/language-feature-examples/**" = ["S", "BLE", "PLW", "SIM", "RUF059", "PLC0415"]
"bench.py" = ["S", "PLW"]
"metta/__init__.py" = ["PLW0603", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["metta"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Every disable below is a judgement with a reason, not a flag list. pylint is
# a GATE, so an entry here says "this rule is wrong for this codebase" and a
# finding that is not covered by one is a real finding.
[tool.pylint."messages control"]
disable = [
    # Style the project settles elsewhere: ruff owns line length and import
    # order, and interrogate owns docstring coverage with a threshold.
    "line-too-long",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "invalid-name",
    # Size and shape, which xenon already bounds by complexity rather than by
    # counting. order_key/1 returns seven times because Prolog's standard
    # order of terms has seven cases, and MeTTa's surface is ledger item B1.
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "too-few-public-methods",
    "too-many-lines",
    # A typing.Protocol's members have `...` bodies. A class satisfying one
    # structurally does not "override" anything, so every hit is a Protocol.
    "abstract-method",
    # The underscore marks the PACKAGE boundary, not a per-module one: these
    # are sibling internals of one package reading each other, which is what
    # the leading underscore on the module name already says.
    "protected-access",
    # Judged per site and marked there for ruff, which sees the same three:
    # E402 in the bootstrap, BLE001 where a BaseException must reach the
    # caller, PLC0415 where a module is deliberately lazy.
    "wrong-import-position",
    "broad-exception-caught",
    "import-outside-toplevel",
    # Counts a function-level deferred import as a module edge. results.py
    # imports space inside why() precisely to break the cycle, and says so.
    # import-linter models the real rule and is a passing gate.
    "cyclic-import",
    # Every hit is `annotation is type(None)`, which compares an annotation to
    # the NoneType CLASS by identity. isinstance cannot express that.
    "unidiomatic-typecheck",
    # `format` is a public parameter name on save() and load(). The shadow is
    # function-local; renaming it would break the API to please a linter.
    "redefined-builtin",
    # Visitor dispatch: getattr(self, f"_x_{...}") guarded by an is-None
    # raise, so the value pylint cannot infer is always a bound method.
    "not-callable",
    # PEP 562. The name resolves through the module __getattr__ below it, and
    # ruff's F822 is annotated at the same line for the same reason.
    "undefined-all-variable",
    # The three remaining are __all__ lists, which are two modules' public
    # surfaces rather than duplicated logic.
    "duplicate-code",
]

[tool.mypy]
python_version = "3.12"
files = ["metta"]
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "array_api_compat", "faiss", "hypothesis", "numpy", "pandas",
    "polars", "rich.*", "websocket",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.interrogate]
fail-under = 80
exclude = ["tests", "examples", "build"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-nested-classes = true
ignore-nested-functions = true
ignore-overloaded-functions = true
ignore-private = true
ignore-property-decorators = true
ignore-semiprivate = true

[tool.vulture]
# Dead assignments are 60 percent findings. Vulture hard-ignores private
# variable names regardless of confidence, so the named delimiter contract
# also pins the removed _BARE name structurally; dynamic uses are explicit in
# the whitelist rather than hidden behind broad ignore patterns [tested:
# test_every_delimiter_check_derives_from_one_grammar_rule and the GATE vulture
# lane; commit=3ae4e6b08bc82d8b9cbdf934afc92ada7cf7a19e].
min_confidence = 60
paths = ["metta", "bench.py", "vulture_whitelist.py"]
# The generated vocabulary module is data: every member is read by VALUE
# (membership, iteration, the wire), so name-reachability is the wrong
# question for it and each catalog row would need a fresh whitelist line.
exclude = ["metta/vocabularies.py"]
ignore_names = ["exc_type", "exc_val", "exc_tb", "tb", "exc"]

# Six of refurb's rules are wrong for this codebase rather than unfixed, and
# the reason is written here so nobody re-opens them one at a time.
#
# FURB123  "redundant cast". It reads an annotation as a fact, and here an
#          annotation is a claim about what a caller SHOULD pass: the casts
#          are what make it true. Removing tuple(columns) in results.py would
#          break outright, since the next line indexes what a generator
#          argument would already have consumed.
# FURB149  `truth is True` at the janus boundary means EXACTLY the boolean and
#          not merely truthy, which is the distinction the boundary exists to
#          keep.
# FURB138  the loop it wants comprehended deduplicates against the list being
#          built, and a comprehension cannot reference that list.
# FURB107  contextlib.suppress costs a context manager per call where
#          try/except costs nothing on the success path, and the site is an
#          attribute-cache lookup.
# FURB140  starmap erases the names the comprehension gives its pair, which is
#          what says what the pair IS.
# FURB184  chaining away a named intermediate is a style preference, and this
#          codebase's is the named one.
[tool.refurb]
ignore = ["FURB123", "FURB149", "FURB138", "FURB107", "FURB140", "FURB184"]

[tool.bandit]
exclude_dirs = ["tests", "build"]

# _compliance.py and _gateway_compliance.py are pytest suites that happen to
# ship: their asserts ARE the contract a space provider or gateway is held to,
# and B101 exists because asserts vanish under -O, which is not how a test
# suite is run. ruff's S101 is already ignored project-wide for the same
# reason, so this only makes the two tools agree.
[tool.bandit.assert_used]
skips = ["*/_compliance.py", "*/_gateway_compliance.py"]

[tool.deptry]
known_first_party = [
    "metta", "example_parity", "twin_coverage", "phrasebook", "phrasebook_entries",
    "alpha", "aio_divergences", "aiogen", "ledger", "ledger_entries", "reference",
    "vocabgen",
]
extend_exclude = ["examples", "build", "bench.py", "benchmarks"]
optional_dependencies_dev_groups = ["test", "checks"]

# Every one of these is imported, and none of them by a statement a static
# scan can see. janus_swi goes through importlib.import_module so that
# importing metta does not start an engine, which is a property the suite
# tests for by name (test_package_import_does_not_require_janus); the rest go
# through require_module, which raises installation guidance instead of an
# ImportError when an extra is absent. Declaring them is correct and deptry
# cannot see the use.
[tool.deptry.per_rule_ignores]
# pytest is imported only by the pytest11 plugin module, which pytest
# itself loads; it is not a runtime dependency of the library. rich is
# imported only inside the __rich__ protocol method, which only rich
# itself calls, so its presence is the precondition of the call.
DEP004 = ["pytest"]
DEP003 = ["rich"]
DEP002 = [
    "janus-swi",
    "array-api-compat",
    "faiss-cpu",
    "numpy",
    "pandas",
    "polars",
    "websocket-client",
]

[tool.importlinter]
root_package = "metta"
# Import Linter 2.13 treats imports guarded by TYPE_CHECKING as runtime edges
# unless this root option is enabled; these annotations never execute.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "atoms is the base layer"
type = "forbidden"
source_modules = ["metta.atoms", "metta.errors"]
forbidden_modules = [
    "metta._space", "metta.ops", "metta.define", "metta.convert",
    "metta.integrate", "metta.subscribe", "metta.events",
]

[[tool.importlinter.contracts]]
name = "leaf modules do not import the facade"
type = "forbidden"
source_modules = [
    "metta.subscribe", "metta.events", "metta.foreign", "metta.casting",
    "metta._debug", "metta._trace", "metta.lint", "metta.derivation",
    "metta.results", "metta.vocabularies",
]
forbidden_modules = ["metta._space"]
ignore_imports = [
    # EventStream.fold reaches Space only when a carrier was supplied, so
    # importing the event leaf does not load the core facade.
    "metta.events -> metta._space",
    # The same carrier branch defers the optional algebra implementation until
    # fold is called with under=, leaving ordinary event imports independent.
    "metta.events -> metta.algebra",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "core does not import satellites"
type = "forbidden"
source_modules = [
    "metta",
    "metta._api_types",
    "metta._atom_namespace",
    "metta._atom_wire",
    "metta._atoms_core",
    "metta._callbacks",
    "metta._codec_kit",
    "metta._config",
    "metta._contract",
    "metta._define_context",
    "metta._define_expression",
    "metta._define_facts",
    "metta._define_loops",
    "metta._define_statements",
    "metta._define_twins",
    "metta._documentation",
    "metta._engine",
    "metta._head_meaning",
    "metta._object_fields",
    "metta._operator_lowerings",
    "metta._ops",
    "metta._optional",
    "metta._parameterized",
    "metta._prelude",
    "metta._source_forms",
    "metta._space",
    "metta._space_definitions",
    "metta._space_diagnostics",
    "metta._space_execution",
    "metta._space_objects",
    "metta._space_persistence",
    "metta._space_query",
    "metta._tokens",
    "metta._type_annotations",
    "metta._version",
    "metta.answer",
    "metta.atoms",
    "metta.define",
    "metta.errors",
    "metta.ops",
    "metta.results",
    "metta._rules",
    # vocabularies is generated data over atoms alone; core doors annotate
    # and validate with its enum classes, so it is core, not a satellite.
    "metta.vocabularies",
]
forbidden_modules = [
    # _world is the deferred filesystem/foreign-space implementation reached
    # only by Space.reify and Space.commit, so it belongs with the satellites.
    "metta._world",
    # _saga is the deferred recovery implementation reached only by
    # Space.saga, so ordinary core imports do not load its event machinery.
    "metta._saga",
    "metta._persistent",
    "metta.aio",
    "metta.algebra",
    "metta.arrays",
    "metta.casting",
    "metta.convert",
    "metta.derivation",
    "metta.events",
    "metta.foreign",
    "metta.integrate",
    "metta.lint",
    "metta.manifest",
    "metta.parallel",
    "metta.paths",
    "metta.remote",
    "metta.spaces",
    "metta.structures",
    "metta.subscribe",
    "metta.tables",
    "metta.testing",
    "metta._debug",
    "metta._trace",
    "metta.wire",
]
allow_indirect_imports = false
as_packages = false
# Forbidden contracts remove exact ignored edges before checking indirect paths.
# [source: https://github.com/seddonym/import-linter/blob/f544debbb0efe10092cd387032ea76b94a0acee0/docs/contract_types/forbidden.md;
#   commit=350c0d9dbd3c78a4f779d6331e223e939b94c2c8]
ignore_imports = [
    # Space.reify and Space.commit defer _world until those methods are called,
    # so importing the core does not load the filesystem/foreign-space helper.
    "metta._space -> metta._world",
    # Space.saga defers the recovery runner until that method is called.
    "metta._space -> metta._saga",
]
unmatched_ignore_imports_alerting = "error"

# The `coverage` REPORT lane. Branch coverage over the library, no percentage
# gate: the number is a map of what the suite reaches, and a threshold on it
# rewards writing tests that touch lines rather than tests that decide
# anything -- which is what the `mutation` lane below measures instead.
[tool.coverage.run]
branch = true
source = ["metta"]
# Each xdist worker is its own process; pytest-cov writes one data file per
# worker and combines them, which needs the suffixed form.
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# `if TYPE_CHECKING:` bodies and `@overload` stubs never execute, and a
# NotImplementedError body is a refusal a subclass answers.
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

# The `mutation` REPORT lane. It runs from `.mutmut/`, a scratch directory ONE
# level under the repository root holding a copy of the package and a copy of
# the suite, and that depth is the whole reason the directory exists:
#
#   - mutmut names a mutant from the file's path under the current directory and
#     matches it at run time against the function's `__module__`, so the two
#     agree only when the package sits DIRECTLY under the directory mutmut runs
#     in. From the repository root, `extensions/python/metta` produced keys
#     `extensions.python.metta.answer.*` against a runtime module `metta.answer`
#     and every mutant read "no tests": 55 of them, 0 functions traced
#     [measured 2026-09-07; mutmut/mutation/trampoline.py:60 builds the runtime
#     name from `orig_func.__module__`].
#   - mutmut runs the suite inside `mutants/`, which puts the copy back at the
#     depth the tree assumes: `.mutmut/mutants/metta/shim.pl` reaches the
#     engine as `../../../engine`, and `.mutmut/mutants/tests/conftest.py`
#     reaches bounded.sh as `parents[3]`, exactly as `extensions/python/metta`
#     and `extensions/python/tests` do. So nothing needs copying but the two
#     directories: the engine, the shipped libraries and the Python seat's
#     bridge.pl are read from the real tree.
#
# WHICH mutants are tested is the lane's argument, an fnmatch pattern over
# mutmut's own mutant names (`mutmut run 'metta.answer.*'`); WHICH tests judge
# them is PYTEST_ADDOPTS, because mutmut takes its test selection from
# configuration alone and a lane cannot rewrite this file.
[tool.mutmut]
source_paths = ["metta"]
also_copy = ["tests"]
pytest_add_cli_args = [
    "-p", "no:benchmark",
    "-p", "no:randomly",
    "-p", "no:cacheprovider",
    "-q",
]
# mutmut's own budget per mutant: it times the clean suite once and kills a
# mutant that takes longer than `baseline * multiplier + constant`. Four times
# is generous enough for a box that idles at loadavg 25-35 while still ending a
# mutant that turned a bounded loop into an unbounded one, and the fifteen
# seconds keep a sub-second baseline from making the bound unreachably tight.
timeout_multiplier = 4.0
timeout_constant = 15.0
